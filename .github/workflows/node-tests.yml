name: Node tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js www/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify root and www mirrors
        shell: bash
        run: |
          set -euo pipefail
          for name in app.js geocoder.js scene-shadow.js shadow-router.js solar-worker.js; do
            root_hash=$(sha256sum "js/$name" | cut -d' ' -f1)
            www_hash=$(sha256sum "www/js/$name" | cut -d' ' -f1)
            test "$root_hash" = "$www_hash"
          done
