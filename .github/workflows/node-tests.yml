name: Node tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Labelled drive regression gate
        run: npm run test:drive-regression

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js www/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Verify root and www mirrors
        run: npm run check:mirrors

      - name: Android debug compile (unsigned debug variant)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 13114758

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Sync Capacitor Android plugins and assets
        shell: bash
        run: npx cap sync android

      - name: Build Android debug APK
        shell: bash
        run: |
          cd android
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
          chmod +x gradlew
          bash ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon --max-workers=2

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        bundle: [root, www]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # One software-WebGL browser at a time on each independent runner.
      - run: npx playwright test --project=${{ matrix.bundle }}
