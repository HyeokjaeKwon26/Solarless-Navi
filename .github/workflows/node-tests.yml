name: Node tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js www/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify root and www mirrors
        shell: bash
        run: |
          set -euo pipefail
          for name in app.js app-version.js debug-logger.js geocoder.js i18n.js nrel-spa.js offline-map.js route-state.js scene-pack-worker.js scene-shadow.js shadow-router.js solar-physics.js solar-worker.js suncalc.js pip-controller.js; do
            root_hash=$(sha256sum "js/$name" | cut -d' ' -f1)
            www_hash=$(sha256sum "www/js/$name" | cut -d' ' -f1)
            test "$root_hash" = "$www_hash"
          done
          for name in index.html style.css; do
            root_hash=$(sha256sum "$name" | cut -d' ' -f1)
            www_hash=$(sha256sum "www/$name" | cut -d' ' -f1)
            test "$root_hash" = "$www_hash"
          done

      - name: Android debug compile (unsigned debug variant)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Sync Capacitor Android plugins and assets
        shell: bash
        run: npx cap sync android

      - name: Build Android debug APK
        shell: bash
        run: |
          cd android
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
          chmod +x gradlew
          bash ./gradlew assembleDebug --no-daemon
